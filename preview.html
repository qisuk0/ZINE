<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预览 - ZINE集</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="pv-page">
    <a class="pv-back" href="index.html">‹ 返回</a>

    <div class="pv-stage">
      <div class="book">
        <div class="spread">
          <div class="page page-left" id="pageLeft">
            <div class="preview-content" id="pageContentLeft"></div>
            <span class="page-no" id="pageNoLeft"></span>
          </div>
          <div class="page page-right" id="pageRight">
            <div class="preview-content" id="pageContentRight"></div>
            <span class="page-no" id="pageNoRight"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="pv-data-status" id="previewStatus" role="status" aria-live="polite"></div>

    <!-- 放大查看 -->
    <div class="pv-zoom" id="zoomOverlay">
      <div class="zoom-page" id="zoomPage"></div>
    </div>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <clipPath id="zineClipHeart" clipPathUnits="objectBoundingBox">
          <path d="M0.5,0.95 C0.22,0.76 0.02,0.56 0.02,0.33 C0.02,0.13 0.16,0.02 0.31,0.02 C0.4,0.02 0.47,0.07 0.5,0.14 C0.53,0.07 0.6,0.02 0.69,0.02 C0.84,0.02 0.98,0.13 0.98,0.33 C0.98,0.56 0.78,0.76 0.5,0.95 Z"/>
        </clipPath>
        <clipPath id="zineClipStar" clipPathUnits="objectBoundingBox">
          <path d="M0.5,0.03 L0.623,0.36 L0.976,0.376 L0.7,0.595 L0.794,0.935 L0.5,0.74 L0.206,0.935 L0.3,0.595 L0.024,0.376 L0.377,0.36 Z"/>
        </clipPath>
      </defs>
    </svg>
  </div>

  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud-store.js"></script>
  <script src="theme.js"></script>
  <script src="preview.js"></script>
</body>
</html>
