<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f2f9" />
  <title>手账编辑 - ZINE集</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --theme-h: 251;
      --bg: hsl(var(--theme-h) 34% 96%);
      --card: #ffffff;
      --paper: hsl(var(--theme-h) 37% 92%);
      --text: hsl(var(--theme-h) 12% 12%);
      --text-sub: hsl(var(--theme-h) 9% 60%);
      --purple: hsl(var(--theme-h) 27% 53%);
      --purple-soft: hsl(var(--theme-h) 42% 89%);
      --theme-surface: hsl(var(--theme-h) 40% 95%);
      --radius: 20px;
      --ink-warm: #665746;
    }

    html[data-theme="red"] { --theme-h: 5; }
    html[data-theme="orange"] {
      --theme-h: 24;
      --bg: hsl(24 45% 96%);
      --paper: hsl(24 50% 92%);
      --text: hsl(24 12% 12%);
      --text-sub: hsl(24 12% 58%);
      --purple: hsl(24 50% 52%);
      --purple-soft: hsl(24 52% 88%);
      --theme-surface: hsl(24 52% 95%);
    }
    html[data-theme="mono"] {
      --theme-h: 0;
      --bg: #f5f5f5;
      --paper: #e8e8e8;
      --text: #141414;
      --text-sub: #747474;
      --purple: #555555;
      --purple-soft: #d6d6d6;
      --theme-surface: #efefef;
    }
    html[data-theme="green"] { --theme-h: 145; }
    html[data-theme="blue"] { --theme-h: 214; }
    html[data-theme="purple"] { --theme-h: 251; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button {
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .editor {
      width: min(100%, 480px);
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      flex: 0 0 54px;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-bottom: 1px solid #eeeaf4;
      background: var(--card);
    }

    .back-button {
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      color: #514c59;
      font-size: 24px;
      line-height: 1;
    }

    .title {
      overflow: hidden;
      color: var(--text);
      font-family: Georgia, "Songti SC", serif;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .done-button {
      min-width: 54px;
      border: 0;
      border-radius: 999px;
      padding: 7px 15px;
      background: var(--purple);
      color: #fff;
      font-size: 13px;
      transition: filter 0.15s;
    }

    .done-button:hover {
      filter: brightness(1.08);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .meta-edit-wrap {
      position: relative;
    }

    .meta-edit-button {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      padding: 0;
      border: 1px solid var(--purple-soft);
      border-radius: 50%;
      background: transparent;
      color: #514c59;
    }

    .meta-edit-button[aria-expanded="true"] {
      background: var(--theme-surface);
      color: var(--purple);
    }

    .meta-menu {
      position: absolute;
      top: 42px;
      right: 0;
      z-index: 20;
      min-width: 132px;
      padding: 5px;
      border: 1px solid var(--purple-soft);
      border-radius: 11px;
      background: var(--card);
      box-shadow: 0 8px 24px hsl(var(--theme-h) 22% 30% / 0.2);
    }

    .meta-menu[hidden] {
      display: none;
    }

    .meta-menu button {
      display: block;
      width: 100%;
      padding: 9px 11px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      text-align: left;
    }

    .meta-menu button:hover {
      background: var(--theme-surface);
    }

    .title-dialog {
      width: min(calc(100% - 32px), 360px);
      padding: 0;
      border: 0;
      border-radius: 18px;
      background: var(--card);
      color: var(--text);
      box-shadow: 0 22px 60px rgba(28, 25, 35, 0.3);
    }

    .title-dialog::backdrop {
      background: rgba(37, 32, 46, 0.36);
      backdrop-filter: blur(2px);
    }

    .title-dialog form {
      padding: 22px;
    }

    .title-dialog h2 {
      margin-bottom: 16px;
      font: 20px Georgia, "Songti SC", serif;
    }

    .title-dialog label {
      display: block;
      margin-bottom: 7px;
      color: var(--text-sub);
      font-size: 12px;
    }

    .title-dialog input {
      width: 100%;
      height: 43px;
      padding: 0 12px;
      border: 1px solid var(--purple-soft);
      border-radius: 10px;
      outline: none;
      background: #fbfaff;
      color: var(--text);
      font: inherit;
    }

    .title-dialog input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px hsl(var(--theme-h) 27% 53% / 0.12);
    }

    .title-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .title-dialog-actions button {
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid var(--purple-soft);
      border-radius: 9px;
      background: var(--card);
      font-size: 12px;
    }

    .title-dialog-actions .title-save-button {
      border-color: var(--purple);
      background: var(--purple);
      color: #fff;
    }

    .workspace {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px 10px 14px;
      background:
        radial-gradient(ellipse at 50% 44%, rgba(255, 255, 255, 0.9), transparent 72%),
        #efedf3;
    }

    .canvas {
      position: relative;
      width: min(100%, 430px, calc((100dvh - 260px) * 0.77));
      flex: 0 1 auto;
      aspect-ratio: 0.77;
      overflow: hidden;
      container-type: inline-size;
      border: 1px solid rgba(142, 124, 88, 0.35);
      border-radius: 13px;
      background-color: #fffdf7;
      background-image:
        radial-gradient(rgba(170, 153, 118, 0.22) 0.65px, transparent 0.8px),
        linear-gradient(90deg, transparent 49.5%, rgba(135, 116, 84, 0.04) 50%, transparent 50.5%);
      background-size: 5px 5px, 100% 100%;
      box-shadow:
        0 2px 0 #dfd5c2,
        0 5px 0 #e9e0d1,
        0 12px 24px rgba(64, 53, 39, 0.18);
      touch-action: none;
    }

    .page-controls {
      flex: 0 0 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      color: var(--text-sub);
      font-size: 12px;
    }

    .page-controls button {
      width: 34px;
      height: 30px;
      border: 1px solid var(--purple-soft);
      border-radius: 9px;
      background: var(--card);
      color: var(--purple);
      font-size: 18px;
      line-height: 1;
    }

    .page-controls button:disabled {
      color: #c7c3cf;
      cursor: default;
    }

    .page-indicator {
      min-width: 58px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .canvas::before {
      position: absolute;
      z-index: 0;
      inset: 1.6%;
      border: 1px solid rgba(177, 161, 126, 0.26);
      border-radius: 6px;
      content: "";
      pointer-events: none;
    }

    .canvas-caption {
      position: absolute;
      z-index: 1;
      top: 2.2%;
      left: 42%;
      color: #8e8068;
      font: 700 2.4cqw Georgia, "Songti SC", serif;
      letter-spacing: 0.13em;
      pointer-events: none;
    }

    .el {
      position: absolute;
      z-index: 2;
      user-select: none;
      touch-action: none;
      cursor: grab;
      line-height: 1.15;
    }

    .el-text,
    .el-note,
    .el-label {
      cursor: text;
    }

    .el-content {
      display: block;
      width: 100%;
      min-height: 100%;
      outline: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      user-select: text;
      cursor: text;
    }

    .el-content:empty::before {
      color: var(--text-sub);
      content: attr(data-placeholder);
      font: 12px "PingFang SC", "Microsoft YaHei", sans-serif;
      opacity: 0.85;
      pointer-events: none;
    }

    .el.editing {
      z-index: 8;
      outline: 1.5px solid var(--purple);
      outline-offset: 3px;
      user-select: text;
    }

    .el:active {
      cursor: grabbing;
    }

    .el.selected {
      z-index: 5;
      outline: 1.5px solid var(--purple);
      outline-offset: 3px;
    }

    .handle {
      position: absolute;
      right: -10px;
      bottom: -10px;
      z-index: 6;
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid var(--purple);
      border-radius: 50%;
      background: #fff;
      cursor: nwse-resize;
      touch-action: none;
    }

    .el.selected .handle {
      display: block;
    }

    .rotate-handle {
      position: absolute;
      top: -38px;
      left: 50%;
      z-index: 7;
      display: none;
      width: 28px;
      height: 28px;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--purple);
      border-radius: 50%;
      background: #fff;
      color: var(--purple);
      font-size: 18px;
      line-height: 1;
      cursor: grab;
      touch-action: none;
      transform: translateX(-50%);
    }

    .rotate-handle::after {
      position: absolute;
      top: 100%;
      left: 50%;
      width: 1px;
      height: 8px;
      background: var(--purple);
      content: "";
      transform: translateX(-50%);
    }

    .el.selected .rotate-handle {
      display: flex;
    }

    .delete-handle {
      position: absolute;
      top: -38px;
      right: -6px;
      z-index: 9;
      display: none;
      width: 28px;
      height: 28px;
      align-items: center;
      justify-content: center;
      border: 2px solid #d1584f;
      border-radius: 50%;
      background: #fff;
      color: #d1584f;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      touch-action: none;
    }

    .el.selected .delete-handle {
      display: flex;
    }

    .el.near-top .rotate-handle,
    .el.near-top .delete-handle {
      top: 2px;
    }

    .el.near-top .rotate-handle {
      left: 2px;
      transform: none;
    }

    .el.near-top .rotate-handle::after {
      display: none;
    }

    .el.near-top .delete-handle {
      right: 2px;
    }

    .el.editing .rotate-handle,
    .el.editing .delete-handle,
    .el.editing .handle {
      display: none;
    }

    .el-photo {
      display: flex;
      flex-direction: column;
      padding: 1.5cqw 1.5cqw 5cqw;
      border: 1px solid #e8e2d6;
      background: #fff;
      box-shadow: 0 1cqw 2.2cqw rgba(57, 46, 33, 0.2);
    }

    .el-photo img {
      width: 100%;
      height: 100%;
      display: block;
      flex: 1 1 auto;
      min-height: 0;
      background: #e9e4d9;
      object-fit: cover;
      pointer-events: none;
    }

    .el-photo-large {
      padding-bottom: 5.5cqw;
    }

    .el-photo.frame-film {
      padding: 3.2cqw 1.2cqw;
      border: 0;
      background-color: #26232a;
      background-image:
        repeating-linear-gradient(90deg, #f7f4ef 0 1cqw, transparent 1cqw 2.3cqw),
        repeating-linear-gradient(90deg, #f7f4ef 0 1cqw, transparent 1cqw 2.3cqw);
      background-size: 100% 1.3cqw, 100% 1.3cqw;
      background-position: 0 0.95cqw, 0 calc(100% - 2.25cqw);
      background-repeat: no-repeat;
      box-shadow: 0 1cqw 2.4cqw rgba(38, 35, 42, 0.32);
    }

    .el-photo.frame-stamp {
      padding: 3.4cqw;
      border: 0;
      background-color: #fffdf7;
      background-image: radial-gradient(circle, transparent 0 0.38cqw, #fffdf7 0.4cqw);
      background-size: 1.9cqw 1.9cqw;
      box-shadow: 0 1cqw 2.2cqw rgba(57, 46, 33, 0.18);
    }

    .el-photo.frame-tape::before,
    .el-photo.frame-tape::after {
      position: absolute;
      z-index: 2;
      width: 32%;
      height: 4cqw;
      content: "";
      background: rgba(232, 205, 178, 0.8);
      box-shadow: 0 0.4cqw 0.8cqw rgba(74, 63, 46, 0.14);
    }

    .el-photo.frame-tape::before {
      top: -2.4cqw;
      left: -4cqw;
      transform: rotate(-32deg);
    }

    .el-photo.frame-tape::after {
      right: -4cqw;
      bottom: -2.4cqw;
      transform: rotate(-32deg);
    }

    .el-photo.frame-line {
      padding: 0;
      border: 1.1cqw solid #fffdf7;
      background: transparent;
      box-shadow: 0 0 0 0.45cqw rgba(102, 87, 70, 0.42), 0 1cqw 2.2cqw rgba(57, 46, 33, 0.18);
    }

    .el-photo.frame-soft {
      padding: 0;
      border: 0;
      border-radius: 2.4cqw;
      background: transparent;
      box-shadow: 0 1.4cqw 3cqw rgba(57, 46, 33, 0.24);
    }

    .el-photo.frame-soft img {
      border-radius: 2.4cqw;
    }

    .el-photo.frame-heart,
    .el-photo.frame-star,
    .el-photo.frame-circle,
    .el-photo.frame-hexagon,
    .el-photo.frame-arch {
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      filter: drop-shadow(0 1cqw 1.8cqw rgba(57, 46, 33, 0.28));
    }

    .el-photo.frame-heart img {
      clip-path: url(#zineClipHeart);
    }

    .el-photo.frame-star img {
      clip-path: url(#zineClipStar);
    }

    .el-photo.frame-circle img {
      clip-path: circle(49.5% at 50% 50%);
    }

    .el-photo.frame-hexagon img {
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    .el-photo.frame-arch img {
      border-radius: 50% 50% 4% 4% / 32% 32% 4% 4%;
    }

    .el-video {
      overflow: hidden;
      border: 2px solid #fff;
      border-radius: 8px;
      background: #282532;
      box-shadow: 0 1cqw 2.2cqw rgba(57, 46, 33, 0.24);
    }

    .editor-video-player {
      display: block;
      width: 100%;
      height: 100%;
      background: #282532;
      object-fit: cover;
    }

    .video-drag-handle {
      position: absolute;
      top: 3px;
      left: 3px;
      z-index: 4;
      padding: 2px 5px;
      border-radius: 5px;
      background: rgba(40, 37, 50, 0.72);
      color: #fff;
      font: 10px/1.2 "PingFang SC", "Microsoft YaHei", sans-serif;
      cursor: grab;
      touch-action: none;
    }

    .clip {
      position: absolute;
      top: -5%;
      left: 42%;
      z-index: 3;
      width: 17%;
      height: 12%;
      border: 1px solid rgba(106, 105, 104, 0.35);
      border-radius: 4px 4px 9px 9px;
      background: linear-gradient(100deg, #b6b8b9, #f5f3ed 42%, #a4a7a8 78%, #e1dfd9);
      box-shadow: 0 0.7cqw 1.1cqw rgba(54, 49, 43, 0.25);
      transform: rotate(-8deg);
      pointer-events: none;
    }

    .el-sticker {
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0.7cqw 1cqw rgba(69, 56, 41, 0.2));
      font-size: 9cqw;
    }

    .el-washi {
      height: 5.5cqw;
      border-radius: 1cqw;
      opacity: 0.82;
      box-shadow: 0 0.6cqw 1cqw rgba(74, 63, 46, 0.12);
    }

    .el-text {
      overflow-wrap: anywhere;
      color: var(--ink-warm);
      font: italic 4.3cqw/1.2 Georgia, "Songti SC", serif;
      text-shadow: 0 1px rgba(255, 255, 255, 0.65);
    }

    .el-label {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0.7cqw solid #fff9dd;
      border-radius: 999px;
      background: #f6dc75;
      box-shadow: 0 0.8cqw 1.8cqw rgba(95, 76, 36, 0.23);
      color: #765a35;
      font-size: 4.4cqw;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .el-note {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.6cqw;
      background: #fbf3cf;
      box-shadow: 0 0.8cqw 1.8cqw rgba(75, 60, 35, 0.16);
      color: #66553d;
      font: italic 3.6cqw/1.25 Georgia, "Songti SC", serif;
    }

    .silver-star {
      color: #e8cd73;
      text-shadow: 0 0.5cqw #fff;
    }

    .el-sticker.tone-ins {
      filter: grayscale(0.8) sepia(0.28) brightness(1.03) drop-shadow(0 0.7cqw 1cqw rgba(69, 56, 41, 0.18));
    }

    .status {
      position: absolute;
      right: 12px;
      bottom: 8px;
      left: 12px;
      z-index: 7;
      color: var(--purple);
      font-size: 12px;
      text-align: center;
      pointer-events: none;
    }

    .status.error {
      color: #a33b47;
    }

    .toolbar {
      position: sticky;
      bottom: 0;
      z-index: 10;
      flex: 0 0 auto;
      padding: 7px 8px max(8px, env(safe-area-inset-bottom));
      border-top: 1px solid #ebe7f1;
      background: var(--card);
    }

    .asset-panel {
      display: none;
      min-height: 72px;
      max-height: 112px;
      overflow-x: auto;
      overflow-y: hidden;
      margin-bottom: 5px;
      padding: 7px 5px;
      border-radius: 11px;
      background: var(--theme-surface);
    }

    .asset-panel.open {
      display: block;
    }

    .asset-heading {
      margin: 0 0 6px 2px;
      color: var(--text-sub);
      font-size: 10px;
    }

    .asset-list {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .asset {
      flex: 0 0 auto;
      min-width: 44px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--purple-soft);
      border-radius: 9px;
      background: var(--card);
      font-size: 23px;
      transition: transform 0.15s, background 0.15s;
    }

    .asset:hover {
      transform: translateY(-2px);
      background: #f3f0f9;
    }

    .asset-divider {
      flex: 0 0 auto;
      align-self: center;
      padding: 0 2px;
      color: var(--text-sub);
      font-size: 11px;
      white-space: nowrap;
    }

    .frame-asset {
      flex-direction: row;
      gap: 6px;
      min-width: 0;
      padding: 0 9px;
      font-size: 12px;
    }

    .frame-caption {
      color: var(--text-sub);
      font-size: 12px;
      white-space: nowrap;
    }

    .frame-swatch {
      position: relative;
      display: block;
      flex: 0 0 auto;
      box-sizing: border-box;
      width: 22px;
      height: 28px;
      border: 1px solid #e8e2d6;
      background: #bfb6a4;
    }

    .frame-swatch-classic {
      padding: 2px 2px 7px;
      background: #fff;
    }

    .frame-swatch-classic::before,
    .frame-swatch-tape::before {
      display: block;
      width: 100%;
      height: 100%;
      content: "";
      background: #bfb6a4;
    }

    .frame-swatch-tape {
      padding: 2px 2px 6px;
      background: #fff;
    }

    .frame-swatch-tape::after {
      position: absolute;
      top: -2px;
      left: -3px;
      width: 12px;
      height: 5px;
      content: "";
      background: rgba(232, 205, 178, 0.95);
      transform: rotate(-32deg);
    }

    .frame-swatch-film {
      padding: 4px 2px;
      border-color: #26232a;
      background-color: #26232a;
      background-image:
        repeating-linear-gradient(90deg, #f7f4ef 0 2px, transparent 2px 4.5px),
        repeating-linear-gradient(90deg, #f7f4ef 0 2px, transparent 2px 4.5px);
      background-size: 100% 2.5px, 100% 2.5px;
      background-position: 0 0.8px, 0 calc(100% - 3.3px);
      background-repeat: no-repeat;
    }

    .frame-swatch-film::before {
      display: block;
      width: 100%;
      height: 100%;
      content: "";
      background: #6f6558;
    }

    .frame-swatch-stamp {
      padding: 3px;
      border: 1px dashed #d8cfb9;
      background-color: #fffdf7;
    }

    .frame-swatch-stamp::before {
      display: block;
      width: 100%;
      height: 100%;
      content: "";
      background: #bfb6a4;
    }

    .frame-swatch-line {
      border: 2px solid #fffdf7;
      outline: 1px solid rgba(102, 87, 70, 0.5);

    }

    .frame-swatch-soft {
      border: 0;
      border-radius: 5px;

    .frame-swatch-heart,

    .frame-swatch-arch {

    .ratio-swatch {

    .tool-row {

    .tool-icon {

    }

    .editor-preview .toolbar {
      display: none;
    }

    .editor-preview .el {
      cursor: default;
      outline: none;
    }

    .editor-preview .handle {
      display: none !important;

    @media (max-height: 560px) {
      .canvas {
        width: min(94%, calc((100dvh - 235px) * 0.77));

      .toolbar {
        padding-top: 4px;
      }

      .tool-icon {
        height: 22px;
        font-size: 18px;

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

  <script src="supabase-config.js"></script>

  <script src="theme.js"></script>
  <script>
    const canvas = document.getElementById("canvas");
    const editor = document.querySelector(".editor");
    const assetPanel = document.getElementById("assetPanel");
    const assetHeading = document.getElementById("assetHeading");
    const assetList = document.getElementById("assetList");
    const photoInput = document.getElementById("photoInput");
    const videoInput = document.getElementById("videoInput");
    const coverInput = document.getElementById("coverInput");
    const metaMenu = document.getElementById("metaMenu");
    const metaEditButton = document.querySelector('[data-action="meta-menu"]');
    const titleDialog = document.getElementById("titleDialog");
    const titleForm = document.getElementById("titleForm");
    const titleInput = document.getElementById("titleInput");
    const status = document.getElementById("status");
    const params = new URLSearchParams(window.location.search);
    const bookId = params.get("book");
    let bookTitle = params.get("title");
    const chapterTitle = params.get("ch");
    const pageTitle = document.getElementById("pageTitle");
    const storageKey = bookId && chapterTitle
      ? `zine_chapter_${encodeURIComponent(bookId)}_${encodeURIComponent(chapterTitle)}`
      : "zine_editor_2025-06-14";

    if (bookTitle && chapterTitle) {
      pageTitle.textContent = `${bookTitle} · ${chapterTitle}`;
      document.title = `${chapterTitle} - ${bookTitle} · ZINE集`;
    }

    const PAGE_COUNT = 5;
    const pages = Array.from({ length: PAGE_COUNT }, () => []);
    let elements = pages[0];
    const history = [];
    const future = [];
    const pageIndicator = document.getElementById("pageIndicator");
    const previousPageButton = document.querySelector('[data-action="previous-page"]');
    const nextPageButton = document.querySelector('[data-action="next-page"]');
    let selectedId = null;
    let nextId = 1;
    const requestedPage = Number.parseInt(params.get("page"), 10);
    let currentPage = Number.isInteger(requestedPage) ? Math.max(0, Math.min(PAGE_COUNT - 1, requestedPage)) : 0;
    let activePanel = "sticker";
    let statusTimer;
    const mediaUrls = new Map();
    let mediaDbPromise;
    let editorReady = false;

    function openMediaDb() {
      if (!mediaDbPromise) {
        mediaDbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open("zine_media_v1", 1);
          request.addEventListener("upgradeneeded", () => {
            const db = request.result;
            if (!db.objectStoreNames.contains("media")) {
              db.createObjectStore("media", { keyPath: "id" });
            }
          });
          request.addEventListener("success", () => resolve(request.result), { once: true });
          request.addEventListener("error", () => reject(request.error || new Error("Unable to open media storage.")), { once: true });
        });
      }
      return mediaDbPromise;
    }

    async function storeMedia(file, id) {
      const db = await openMediaDb();
      await new Promise((resolve, reject) => {
        const transaction = db.transaction("media", "readwrite");
        transaction.objectStore("media").put({
          id,
          blob: file,
          name: file.name || id,
          type: file.type || "application/octet-stream",
        });
        transaction.addEventListener("complete", resolve, { once: true });
        transaction.addEventListener("error", () => reject(transaction.error || new Error("Unable to save the media.")), { once: true });
        transaction.addEventListener("abort", () => reject(transaction.error || new Error("Media save was cancelled.")), { once: true });
      });
    }

    async function readMediaRecord(id) {
      const db = await openMediaDb();
      return new Promise((resolve, reject) => {
        const request = db.transaction("media", "readonly").objectStore("media").get(id);
        request.addEventListener("success", () => resolve(request.result), { once: true });
        request.addEventListener("error", () => reject(request.error || new Error("Unable to read the saved media.")), { once: true });
      });
    }

    async function cacheMediaBlob(id, blob) {
      const db = await openMediaDb();
      await new Promise((resolve, reject) => {
        const transaction = db.transaction("media", "readwrite");
        transaction.objectStore("media").put({
          id,
          blob,
          name: blob.name || id,
          type: blob.type || "application/octet-stream",
        });
        transaction.addEventListener("complete", resolve, { once: true });
        transaction.addEventListener("error", () => reject(transaction.error || new Error("Unable to cache the media.")), { once: true });
        transaction.addEventListener("abort", () => reject(transaction.error || new Error("Media caching was cancelled.")), { once: true });
      });
    }

    async function getMediaUrl(id, cloudPath) {
      if (mediaUrls.has(id)) return mediaUrls.get(id);
      const record = await readMediaRecord(id);
      let blob = record && record.blob instanceof Blob ? record.blob : null;
      if (!blob && cloudPath && window.ZineCloud) {
        blob = await ZineCloud.downloadMedia(cloudPath);
        if (blob) await cacheMediaBlob(id, blob);
      }
      if (!blob) throw new Error("The saved media file is missing.");
      const url = URL.createObjectURL(blob);
      mediaUrls.set(id, url);
      return url;
    }

    function showStatus(message) {
      status.textContent = message;
      status.classList.toggle("error", message.startsWith("保存失败") || message.startsWith("读取存档失败"));
      window.clearTimeout(statusTimer);
      if (message) {
        statusTimer = window.setTimeout(() => {
          status.textContent = "";
        }, 3500);
      }
    }

    function cloneElements(source = elements) {
      return source.map((element) => ({ ...element }));
    }

    function remember() {
      history.push(cloneElements());
      if (history.length > 50) history.shift();
      future.length = 0;
    }

    function samplePhoto(sky, hills, caption) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 290">
        <defs><linearGradient id="b" x2="0" y2="1"><stop stop-color="${sky}"/><stop offset="1" stop-color="#f4e9d8"/></linearGradient></defs>
        <rect width="240" height="290" fill="url(#b)"/>
        <circle cx="174" cy="66" r="28" fill="#f4d88e"/>
        <path d="M0 179 65 99l55 69 39-49 81 89v82H0z" fill="${hills}"/>
        <path d="M0 209q56-34 112 0t128-1v82H0z" fill="#a9b89a"/>
        <path d="M0 236q63-25 123 1t117-4v57H0z" fill="#879d83"/>
        <path d="M32 218v-34m0 12-12-12m12 21 13-15m147 15v-42m0 17-14-14m14 27 15-17" fill="none" stroke="#6e806d" stroke-width="4" stroke-linecap="round"/>
        <circle cx="54" cy="187" r="5" fill="#e8aeb3"/>
        <circle cx="207" cy="171" r="5" fill="#eee0a3"/>
        <text x="120" y="268" text-anchor="middle" fill="#fffdf7" font-family="sans-serif" font-size="14">${caption}</text>
      </svg>`;
      return `data:image/svg+xml,${encodeURIComponent(svg)}`;
    }

    function replaceLegacyCatPhoto(src) {
      if (typeof src !== "string" || !src.startsWith("data:image/svg+xml,")) return src;
      let svg;
      try {
        svg = decodeURIComponent(src.slice(src.indexOf(",") + 1));
      } catch (error) {
        console.error("Unable to decode a saved sample photo.", error);
        return src;
      }
      if (!svg.includes("M53 125 48 53l61 42m22 0 61-42-5 72")) return src;
      if (svg.includes("little moments")) return samplePhoto("#e3c6bc", "#cbaa9b", "little moments");
      if (svg.includes("sweet memory")) return samplePhoto("#b9c9d4", "#a9b7a9", "sweet memory");
      if (svg.includes("my favorite")) return samplePhoto("#ded4b9", "#b5b59a", "my favorite");
      return samplePhoto("#c8d3c3", "#a8ba9e", "a lovely day");
    }

    function dataUrlToBlob(dataUrl) {
      return fetch(dataUrl).then((response) => response.blob());
    }

    async function compressPhoto(file) {
      const objectUrl = URL.createObjectURL(file);
      try {
        const image = await new Promise((resolve, reject) => {
          const element = new Image();
          element.addEventListener("load", () => resolve(element), { once: true });
          element.addEventListener("error", () => reject(new Error("Unable to read the selected photo.")), { once: true });
          element.src = objectUrl;
        });
        const maxDimension = 1600;
        const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
        const context = canvas.getContext("2d");
        if (!context) throw new Error("Unable to prepare the selected photo.");
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob(
            (result) => result ? resolve(result) : reject(new Error("Unable to compress the selected photo.")),
            "image/jpeg",
            0.82
          );
        });
        return new File([blob], `${file.name.replace(/\.[^.]+$/, "") || "photo"}.jpg`, {
          type: "image/jpeg",
        });
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    async function uploadElementPhoto(element) {
      if (!element.mediaId || element.cloudPath || !window.ZineCloud) return false;
      const snapshot = ZineCloud.getSnapshot();
      if (!snapshot.user) return false;
      const record = await readMediaRecord(element.mediaId);
      if (!record || !(record.blob instanceof Blob)) return false;
      const cloudPath = await ZineCloud.uploadMedia(record.blob, element.mediaId);
      if (!cloudPath) return false;
      element.cloudPath = cloudPath;
      return true;
    }

    async function migrateEmbeddedPhotos() {
      let changed = false;
      for (const page of pages) {
        for (const element of page) {
          if (element.type !== "photo") continue;
          if (typeof element.src === "string" && /^data:image\/(?!svg\+xml)[^;]+;base64,/i.test(element.src)) {
            try {
              const blob = await dataUrlToBlob(element.src);
              const mediaId = `photo-${bookId || "draft"}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
              await storeMedia(blob, mediaId);
              element.mediaId = mediaId;
              delete element.src;
              await uploadElementPhoto(element);
              changed = true;
            } catch (error) {
              console.error("Unable to move an embedded photo into local media storage.", error);
            }
          } else if (element.mediaId && !element.cloudPath) {
            try {
              if (await uploadElementPhoto(element)) changed = true;
            } catch (error) {
              console.error("Unable to upload a pending page photo.", error);
            }
          }
        }
      }
      if (changed) showStatus("照片已改用本地媒体存储");
      return changed;
    }

    function seedElements() {
      const cozy = samplePhoto("#c8d3c3", "#a8ba9e", "a lovely day");
      const blush = samplePhoto("#e3c6bc", "#cbaa9b", "little moments");
      const blue = samplePhoto("#b9c9d4", "#a9b7a9", "sweet memory");
      const cream = samplePhoto("#ded4b9", "#b5b59a", "my favorite");
      const ids = [];

      function seed(element) {
        element.id = nextId++;
        elements.push(element);
        ids.push(element.id);
      }

      seed({ type: "photo", src: cozy, x: 7, y: 14, w: 24, h: 17, rot: -2 });
      seed({ type: "photo", src: blush, x: 7, y: 35, w: 24, h: 17, rot: 1 });
      seed({ type: "photo", src: blue, x: 7, y: 56, w: 24, h: 17, rot: -1.5 });
      seed({ type: "photo", src: cream, x: 7, y: 77, w: 24, h: 17, rot: 1.5 });
      seed({ type: "photo", src: cozy, x: 56, y: 20, w: 37, h: 32, rot: 1, large: true });
      seed({ type: "washi", color: "#d9c995", x: 31, y: 8, w: 19, h: 5, rot: -3 });
      seed({ type: "note", content: "Let my love,", x: 36, y: 40, w: 24, h: 10, rot: -3 });
      seed({ type: "sticker", content: "⭐", x: 51, y: 13, w: 9, h: 9, rot: 8 });
      seed({ type: "sticker", content: "💛", x: 34, y: 13, w: 8, h: 8, rot: -7 });
      seed({ type: "sticker", content: "💗", x: 43, y: 13, w: 8, h: 8, rot: 4 });
      seed({ type: "label", content: "LUCK", x: 43, y: 57, w: 25, h: 9, rot: 2 });
      seed({ type: "sticker", content: "💜", x: 82, y: 57, w: 8, h: 8, rot: 3 });
      seed({ type: "sticker", content: "⭐", x: 53, y: 72, w: 8, h: 8, rot: -7 });
      seed({ type: "sticker", content: "🎧", x: 65, y: 68, w: 13, h: 12, rot: -5 });
      seed({ type: "sticker", content: "☁️", x: 83, y: 70, w: 11, h: 9, rot: 0 });
      seed({ type: "sticker", content: "☕", x: 77, y: 80, w: 16, h: 16, rot: 4 });
      seed({ type: "washi", color: "#edc3b8", x: 34, y: 89, w: 17, h: 5, rot: 2 });

      selectedId = ids[10];
    }

    function makeElementNode(element) {
      const node = document.createElement("div");
      node.className = `el el-${element.type}`;
      node.dataset.id = String(element.id);
      node.style.left = `${element.x}%`;
      node.style.top = `${element.y}%`;
      node.style.width = `${element.w}%`;
      node.style.transform = `rotate(${element.rot || 0}deg)`;
      if (element.y < 14) node.classList.add("near-top");

      if (element.type === "photo") {
        node.style.height = `${element.h}%`;
        if (element.large) node.classList.add("el-photo-large");
        if (element.frame) node.classList.add(`frame-${element.frame}`);
        const image = document.createElement("img");
        image.alt = "拼贴照片";
        if (element.src) {
          image.src = element.src;
        } else if (element.mediaId) {
          getMediaUrl(element.mediaId, element.cloudPath).then((url) => {
            if (node.isConnected) image.src = url;
          }).catch((error) => {
            console.error("Unable to load the saved photo.", error);
            if (node.isConnected) showStatus("读取照片失败，请重新添加照片");
          });
        }
        node.append(image);
        if (element.large) {
          const clip = document.createElement("span");
          clip.className = "clip";
          clip.setAttribute("aria-hidden", "true");
          node.append(clip);
        }
      } else if (element.type === "video") {
        node.style.height = `${element.h}%`;
        const player = document.createElement("video");
        player.className = "editor-video-player";
        player.controls = true;
        player.playsInline = true;
        player.preload = "metadata";
        player.setAttribute("aria-label", element.name ? `播放视频：${element.name}` : "播放视频");
        player.addEventListener("error", () => showStatus("视频无法播放，请检查文件格式"), { once: true });
        getMediaUrl(element.videoId, element.cloudPath).then((url) => {
          if (node.isConnected) player.src = url;
        }).catch((error) => {
          console.error("Unable to load the saved video.", error);
          if (node.isConnected) showStatus("读取视频失败，请重新添加视频");
        });
        node.append(player);
        const dragHandle = document.createElement("span");
        dragHandle.className = "video-drag-handle";
        dragHandle.textContent = "拖动";
        node.append(dragHandle);
      } else if (element.type === "sticker") {
        node.style.height = `${element.h}%`;
        node.style.fontSize = `${element.w * 0.7}cqw`;
        node.textContent = element.content;
        if (element.content === "⭐") node.classList.add("silver-star");
        if (element.tone === "ins") node.classList.add("tone-ins");
      } else if (element.type === "washi") {
        node.style.height = `${element.h}%`;
        node.style.backgroundColor = element.color;
      } else {
        node.style.minHeight = `${element.h}%`;
        const content = document.createElement("span");
        content.className = "el-content";
        content.textContent = element.content;
        content.title = "双击编辑文字";
        if (!element.content) content.dataset.placeholder = "双击输入文字";
        node.append(content);
      }

      const handle = document.createElement("span");
      handle.className = "handle";
      handle.setAttribute("aria-hidden", "true");
      node.append(handle);
      const rotateHandle = document.createElement("span");
      rotateHandle.className = "rotate-handle";
      rotateHandle.setAttribute("role", "button");
      rotateHandle.setAttribute("aria-label", "旋转元素");
      rotateHandle.textContent = "↻";
      node.append(rotateHandle);
      const deleteHandle = document.createElement("span");
      deleteHandle.className = "delete-handle";
      deleteHandle.setAttribute("role", "button");
      deleteHandle.setAttribute("aria-label", "删除元素");
      deleteHandle.textContent = "✕";
      node.append(deleteHandle);
      return node;
    }

    function render() {
      canvas.querySelectorAll(".el").forEach((node) => node.remove());
      elements.forEach((element) => {
        const node = makeElementNode(element);
        if (element.id === selectedId) node.classList.add("selected");
        canvas.append(node);
      });
      pageIndicator.textContent = `${currentPage + 1} / ${PAGE_COUNT}`;
      previousPageButton.disabled = currentPage === 0;
      nextPageButton.disabled = currentPage === PAGE_COUNT - 1;
    }

    function addElement(element) {
      remember();
      element.id = nextId++;
      element.x = element.x ?? 38;
      element.y = element.y ?? 41;
      element.w = element.w ?? 12;
      element.h = element.h ?? 10;
      element.rot = element.rot ?? (Math.random() * 8 - 4);
      elements.push(element);
      selectedId = element.id;
      render();
      save(true);
    }

    function updateBookMetadata(markEdited = false, changes = {}) {
      if (!bookId) return true;
      try {
        const stored = localStorage.getItem("zine_books_v1");
        if (stored === null) throw new Error("Saved books data is missing.");
        const savedBooks = JSON.parse(stored);
        if (!Array.isArray(savedBooks)) throw new Error("Saved books data must be an array.");
        const book = savedBooks.find((item) => item && item.id === Number(bookId));
        if (!book) throw new Error(`Book ${bookId} was not found.`);
        if (chapterTitle) book.lastChapter = chapterTitle;
        book.lastPage = currentPage;
        if (markEdited) book.lastEditedAt = Date.now();
        Object.assign(book, changes);
        if (window.ZineCloud) {
          if (!window.ZineCloud.setRecord("zine_books_v1", savedBooks)) {
            throw new Error("Unable to save the updated book list.");
          }
        } else {
          localStorage.setItem("zine_books_v1", JSON.stringify(savedBooks));
        }
        return true;
      } catch (error) {
        console.error("Unable to update the book's edit order.", error);
        return false;
      }
    }

    function updateBookEditedAt(markEdited = false) {
      return updateBookMetadata(markEdited);
    }

    function closeMetaMenu() {
      metaMenu.hidden = true;
      metaEditButton.setAttribute("aria-expanded", "false");
    }

    function saveBookTitle(nextTitle) {
      const title = String(nextTitle || "").trim();
      if (!title) {
        showStatus("标题不能为空");
        return false;
      }
      if (!updateBookMetadata(true, { title })) {
        showStatus("标题保存失败");
        return false;
      }
      bookTitle = title;
      pageTitle.textContent = `${bookTitle} · ${chapterTitle || "未命名章节"}`;
      document.title = `${chapterTitle || "手账编辑"} - ${bookTitle} · ZINE集`;
      const url = new URL(window.location.href);
      url.searchParams.set("title", bookTitle);
      window.history.replaceState(null, "", url);
      showStatus("标题已修改");
      return true;
    }

    async function saveBookCover(file) {
      if (!file || !file.type.startsWith("image/")) {
        showStatus("请选择图片文件作为封面");
        return false;
      }
      if (file.size > 20 * 1024 * 1024) {
        showStatus("封面图片不能大于 20 MB");
        return false;
      }
      const objectUrl = URL.createObjectURL(file);
      try {
        const image = await new Promise((resolve, reject) => {
          const element = new Image();
          element.addEventListener("load", () => resolve(element), { once: true });
          element.addEventListener("error", () => reject(new Error("Unable to read the cover image.")), { once: true });
          element.src = objectUrl;
        });
        const maxDimension = 480;
        const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
        const coverCanvas = document.createElement("canvas");
        coverCanvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        coverCanvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
        const context = coverCanvas.getContext("2d");
        if (!context) throw new Error("Unable to prepare the cover image.");
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, coverCanvas.width, coverCanvas.height);
        context.drawImage(image, 0, 0, coverCanvas.width, coverCanvas.height);
        const cover = coverCanvas.toDataURL("image/jpeg", 0.82);
        if (!updateBookMetadata(true, { cover })) {
          showStatus("封面保存失败");
          return false;
        }
        showStatus("封面已修改");
        return true;
      } catch (error) {
        console.error("Unable to save the selected cover.", error);
        showStatus("封面处理失败，请换一张图片");
        return false;
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    function save(markEdited = false) {
      if (!editorReady) return true;
      try {
        pages[currentPage] = cloneElements();
        const pageData = { version: 2, pages };
        const saved = window.ZineCloud
          ? window.ZineCloud.setRecord(storageKey, pageData)
          : (localStorage.setItem(storageKey, JSON.stringify(pageData)), true);
        if (!saved) throw new Error("Unable to save the journal page locally.");
        const editOrderSaved = updateBookEditedAt(markEdited);
        showStatus(editOrderSaved ? "已自动保存" : "页面已保存，但编辑顺序更新失败");
        return true;
      } catch (error) {
        console.error("Unable to save the journal page.", error);
        showStatus("保存失败：浏览器存储空间不足");
        return false;
      }
    }

    function load() {
      try {
        const saved = localStorage.getItem(storageKey);
        if (saved === null) {
          return;
        }
        const parsed = JSON.parse(saved);
        const validTypes = ["photo", "video", "sticker", "washi", "text", "note", "label"];
        const validatePage = (savedPage) => {
          if (!Array.isArray(savedPage)) throw new Error("Saved page data must be an array.");
          return savedPage.filter((item) =>
            item
            && Number.isInteger(item.id)
            && validTypes.includes(item.type)
            && Number.isFinite(item.x)
            && Number.isFinite(item.y)
            && Number.isFinite(item.w)
            && Number.isFinite(item.h)
          ).map((item) => item.type === "photo"
            ? { ...item, src: replaceLegacyCatPhoto(item.src) }
            : { ...item });
        };

        if (Array.isArray(parsed)) {
          pages[0] = validatePage(parsed);
        } else if (parsed && Array.isArray(parsed.pages)) {
          parsed.pages.slice(0, PAGE_COUNT).forEach((savedPage, index) => {
            pages[index] = validatePage(savedPage);
          });
        } else {
          throw new Error("Saved journal page data has an invalid format.");
        }

        elements = pages[currentPage];
        nextId = pages.flat().reduce((max, item) => Math.max(max, item.id), 0) + 1;
      } catch (error) {
        console.error("Unable to load the saved journal page.", error);
        pages.forEach((page) => page.splice(0, page.length));
        elements = pages[currentPage];
        showStatus("读取存档失败，已新建空白页");
      }
    }

    function changePage(direction) {
      const nextPage = currentPage + direction;
      if (nextPage < 0 || nextPage >= PAGE_COUNT) return;
      if (!save()) return;
      currentPage = nextPage;
      elements = pages[currentPage];
      selectedId = null;
      history.length = 0;
      future.length = 0;
      render();
      updateBookEditedAt(false);
    }

    function finishTextEdit(content, element, original, previousElements, cancelled) {
      content.contentEditable = "false";
      content.removeAttribute("aria-label");
      content.closest(".el").classList.remove("editing");

      if (cancelled) {
        element.content = original;
        content.textContent = original;
        return;
      }

      const updated = content.textContent.replace(/\r/g, "");
      if (updated === original) return;
      element.content = updated;
      if (updated) {
        delete content.dataset.placeholder;
      } else {
        content.dataset.placeholder = "双击输入文字";
      }
      history.push(previousElements);
      if (history.length > 50) history.shift();
      future.length = 0;
      save(true);
    }

    function beginTextEdit(content, element) {
      if (content.contentEditable === "true") return;
      const node = content.closest(".el");
      selectedId = element.id;
      canvas.querySelectorAll(".el.selected").forEach((selected) => {
        selected.classList.remove("selected");
      });
      node.classList.add("selected", "editing");

      const original = element.content;
      const previousElements = cloneElements();
      let cancelled = false;
      content.contentEditable = "true";
      content.spellcheck = false;
      content.setAttribute("aria-label", "编辑文字，按 Enter 保存，按 Escape 取消");
      content.focus();

      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(content);
      selection.removeAllRanges();
      selection.addRange(range);

      content.addEventListener("keydown", (keyEvent) => {
        if (keyEvent.key === "Enter" && !keyEvent.shiftKey) {
          keyEvent.preventDefault();
          content.blur();
        } else if (keyEvent.key === "Escape") {
          keyEvent.preventDefault();
          cancelled = true;
          content.blur();
        }
      });
      content.addEventListener("blur", () => {
        finishTextEdit(content, element, original, previousElements, cancelled);
      }, { once: true });
    }

    canvas.addEventListener("dblclick", (event) => {

      const bounds = canvas.getBoundingClientRect();

      if (assetType === "upload") {
        photoInput.click();
      } else if (assetType === "video-upload") {
        videoInput.click();
      } else if (assetType === "photo" && assetValue === "sample") {
        const full = pendingRatio && pendingRatio.value === "full";
        addElement({
          type: "photo",
          src: samplePhoto("#c8d3c3", "#a8ba9e", "a lovely day"),
          ...(full
            ? { x: 0, y: 0, w: 100, h: 100, rot: 0 }
            : { w: 28, h: heightForRatio(28, pendingRatio, 23) }),

      } else if (assetType === "photo-frame") {
        const photo = elements.find((item) => item.id === selectedId && item.type === "photo");

          showStatus("先在画布上选中一张照片，再选边框款式");

        else photo.frame = assetValue;

        save(true);
      } else if (assetType === "photo-ratio") {
        const ratio = PHOTO_RATIOS.find((item) => item.value === assetValue);
        if (!ratio) return;
        pendingRatio = ratio;
        const photo = elements.find((item) => item.id === selectedId && item.type === "photo");
        if (!photo) {
          showStatus(ratio.value === "full" ? "新照片将铺满整页" : `新照片将使用${ratio.label}比例`);
          return;
        }
        remember();
        if (ratio.value === "full") {
          photo.x = 0;
          photo.y = 0;
          photo.w = 100;
          photo.h = 100;
          photo.rot = 0;
          render();
          save(true);
          showStatus("照片已铺满整页");
          return;
        }
        const bounds = canvas.getBoundingClientRect();
        let height = photo.w * (ratio.rh / ratio.rw) * (bounds.width / bounds.height);
        if (height > 80) {
          height = 80;
          photo.w = Math.max(6, 80 / ((ratio.rh / ratio.rw) * (bounds.width / bounds.height)));
        } else if (height < 10) {
          height = 10;
          photo.w = Math.max(6, 10 / ((ratio.rh / ratio.rw) * (bounds.width / bounds.height)));
        }
        photo.h = height;
        render();
        save(true);
        showStatus(`已应用${ratio.label}比例`);

    canvas.addEventListener("pointerdown", (event) => {
      if (event.target.closest(".el-content[contenteditable='true']")) return;
      if (event.target.closest(".el-video video")) return;
      const node = event.target.closest(".el");
      if (!node) {
        selectedId = null;
        render();
        return;
      }

      event.preventDefault();
      const element = elements.find((item) => item.id === Number(node.dataset.id));
      if (!element) return;

      if (event.target.classList.contains("delete-handle")) {
        remember();
        elements.splice(elements.indexOf(element), 1);
        selectedId = null;
        render();
        save(true);
        return;
      }

      const wasSelected = element.id === selectedId;
      canvas.querySelectorAll(".el.selected").forEach((selected) => {
        selected.classList.remove("selected");
      });
      node.classList.add("selected");
      selectedId = element.id;

      const rotating = event.target.classList.contains("rotate-handle");
      const resizing = event.target.classList.contains("handle");
      if (element.type === "video" && !rotating && !resizing && !event.target.classList.contains("video-drag-handle")) return;
      const bounds = canvas.getBoundingClientRect();
      const startX = event.clientX;
      const startY = event.clientY;
      const original = { ...element };
      const nodeBounds = node.getBoundingClientRect();
      const centerX = nodeBounds.left + nodeBounds.width / 2;
      const centerY = nodeBounds.top + nodeBounds.height / 2;
      const startAngle = Math.atan2(startY - centerY, startX - centerX) * (180 / Math.PI);
      let moved = false;

      function move(moveEvent) {
        const dx = ((moveEvent.clientX - startX) / bounds.width) * 100;
        const dy = ((moveEvent.clientY - startY) / bounds.height) * 100;

        if (rotating) {
          const angle = Math.atan2(moveEvent.clientY - centerY, moveEvent.clientX - centerX) * (180 / Math.PI);
          element.rot = (original.rot || 0) + angle - startAngle;
          node.style.transform = `rotate(${element.rot}deg)`;
        } else if (resizing) {
          element.w = Math.max(6, Math.min(85, original.w + dx));
          if (element.type === "photo") {
            const aspect = (original.w * bounds.width) / (original.h * bounds.height);
            element.h = (element.w * bounds.width) / (aspect * bounds.height);
          } else if (element.type === "sticker") {
            element.h = Math.max(6, original.h + dy);
          }
          node.style.width = `${element.w}%`;
          node.style.height = `${element.h}%`;
          if (element.type === "sticker") {
            node.style.fontSize = `${element.w * 0.7}cqw`;
          }
        } else {
          element.x = Math.max(0, Math.min(100 - element.w, original.x + dx));
          element.y = Math.max(0, Math.min(100 - element.h, original.y + dy));
          node.style.left = `${element.x}%`;
          node.style.top = `${element.y}%`;
          node.classList.toggle("near-top", element.y < 14);
        }

        moved = moved || dx !== 0 || dy !== 0;
      }

      function finish(finishEvent) {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", finish);
        window.removeEventListener("pointercancel", finish);
        if (!moved) {
          if (
            finishEvent
            && finishEvent.type === "pointerup"
            && finishEvent.pointerType !== "mouse"
            && wasSelected
            && ["text", "note", "label"].includes(element.type)
            && node.isConnected
          ) {
            const content = node.querySelector(".el-content");
            if (content) beginTextEdit(content, element);
          }
          return;
        }
        history.push(cloneElements().map((item) => item.id === element.id ? original : item));
        if (history.length > 50) history.shift();
        future.length = 0;
        save(true);
      }

      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", finish);
      window.addEventListener("pointercancel", finish);
    });

    editor.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action], button[data-panel]");
      if (!button) return;

      if (button.dataset.panel) {
        const name = button.dataset.panel;
        if (activePanel === name && assetPanel.classList.contains("open")) {
          closePanel();

          showPanel(name);

        return;
      }

      if (button.dataset.action === "previous-page") {
        changePage(-1);
      } else if (button.dataset.action === "next-page") {
        changePage(1);
      } else if (button.dataset.action === "undo") {
        if (!history.length) return;
        future.push(cloneElements());
        elements.splice(0, elements.length, ...history.pop());
        selectedId = null;
        render();
        save(true);
      } else if (button.dataset.action === "redo") {
        if (!future.length) return;
        history.push(cloneElements());
        elements.splice(0, elements.length, ...future.pop());
        selectedId = null;
        render();
        save(true);
      } else if (button.dataset.action === "meta-menu") {
        const opening = metaMenu.hidden;
        metaMenu.hidden = !opening;
        metaEditButton.setAttribute("aria-expanded", String(opening));
      } else if (button.dataset.action === "edit-title") {
        closeMetaMenu();
        titleInput.value = bookTitle || "";
        titleDialog.showModal();
        titleInput.focus();
        titleInput.select();
      } else if (button.dataset.action === "edit-cover") {
        closeMetaMenu();
        coverInput.click();
      } else if (button.dataset.action === "cancel-title") {
        titleDialog.close();
      } else if (button.dataset.action === "done") {
        if (save()) window.history.back();
      } else if (button.dataset.action === "back") {
        save();
        window.history.back();
      }
    });

    titleForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (saveBookTitle(titleInput.value)) titleDialog.close();
    });

    coverInput.addEventListener("change", async () => {
      const file = coverInput.files && coverInput.files[0];
      coverInput.value = "";
      if (file) await saveBookCover(file);
    });

    document.addEventListener("click", (event) => {
      if (!metaMenu.hidden && !event.target.closest(".meta-edit-wrap")) closeMetaMenu();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !metaMenu.hidden) {
        closeMetaMenu();
        metaEditButton.focus();
      }
    });

    photoInput.addEventListener("change", async () => {
      const file = photoInput.files && photoInput.files[0];
      photoInput.value = "";
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        showStatus("请选择图片文件");
        return;
      }
      if (file.size > 20 * 1024 * 1024) {
        showStatus("照片不能大于 20 MB");
        return;
      }

      const photoId = `photo-${bookId || "draft"}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      try {
        showStatus("正在处理照片…");
        const compressed = await compressPhoto(file);
        await storeMedia(compressed, photoId);
        mediaUrls.set(photoId, URL.createObjectURL(compressed));
        let cloudPath = null;
        const snapshot = window.ZineCloud ? ZineCloud.getSnapshot() : { user: null };
        if (snapshot.user) {
          showStatus("正在把照片保存到账号…");
          try {
            cloudPath = await ZineCloud.uploadMedia(compressed, photoId);
          } catch (uploadError) {
            console.error("Unable to upload the selected photo to the account.", uploadError);
            showStatus("照片已保存在本机，账号上传稍后重试");
          }
        }
        const full = pendingRatio && pendingRatio.value === "full";
        addElement({
          type: "photo",
          mediaId: photoId,
          cloudPath,
          ...(full
            ? { x: 0, y: 0, w: 100, h: 100, rot: 0 }
            : { w: 29, h: heightForRatio(29, pendingRatio, 24) }),
        });
      } catch (error) {
        console.error("Unable to save the selected photo.", error);
        showStatus("照片处理失败，请换一张图片重试");
      }
    });

    videoInput.addEventListener("change", async () => {
      const file = videoInput.files && videoInput.files[0];
      videoInput.value = "";
      if (!file) return;
      if (!file.type.startsWith("video/")) {
        showStatus("请选择视频文件");
        return;
      }
      if (file.size > 50 * 1024 * 1024) {
        showStatus("视频不能大于 50 MB");
        return;
      }

      const videoId = `video-${bookId || "draft"}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      try {
        await storeMedia(file, videoId);
        mediaUrls.set(videoId, URL.createObjectURL(file));
        let cloudPath = null;
        if (window.ZineCloud) {
          showStatus("正在把视频保存到账号…");
          try {
            cloudPath = await ZineCloud.uploadMedia(file, videoId);
          } catch (uploadError) {
            console.error("Unable to upload the selected video to the account.", uploadError);
            showStatus("视频已保存在本机，账号上传稍后重试");
          }
        }
        addElement({ type: "video", videoId, cloudPath, name: file.name, w: 38, h: 27 });
      } catch (error) {
        console.error("Unable to save the selected video.", error);
        showStatus("视频保存失败，请检查浏览器存储空间");
      }
    });

    document.addEventListener("keydown", (event) => {
      const modifier = event.ctrlKey || event.metaKey;
      if (modifier && event.key.toLowerCase() === "z" && !event.shiftKey) {
        event.preventDefault();
        editor.querySelector('[data-action="undo"]').click();
      } else if (modifier && (event.key.toLowerCase() === "y" || (event.key.toLowerCase() === "z" && event.shiftKey))) {
        event.preventDefault();
        editor.querySelector('[data-action="redo"]').click();
      } else if (!modifier && (event.key === "Delete" || event.key === "Backspace") && selectedId !== null) {
        event.preventDefault();
        const selectedIndex = elements.findIndex((element) => element.id === selectedId);
        if (selectedIndex === -1) return;
        remember();
        elements.splice(selectedIndex, 1);
        selectedId = null;
        render();
        save(true);
      }
    });

    async function startEditorPage() {
      try {
        if (window.ZineCloud) await window.ZineCloud.ready;
      } catch (error) {
        console.error("Unable to finish account sync before opening the editor.", error);
      }
      load();
      elements = pages[currentPage];
      await migrateEmbeddedPhotos();
      render();
      showPanel("sticker");
      editorReady = true;
      save();
    }

    startEditorPage();

    window.addEventListener("pagehide", save);
    window.addEventListener("pagehide", () => {
      mediaUrls.forEach((url) => URL.revokeObjectURL(url));
      mediaUrls.clear();
    }, { once: true });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") save();
    });
  </script>
</body>
</html>
