<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我 - ZINE集</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="me-page">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="修改主题颜色" aria-expanded="false" aria-controls="themeMenu">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="13.5" cy="6.5" r=".8" fill="currentColor"></circle>
        <circle cx="17.5" cy="10.5" r=".8" fill="currentColor"></circle>
        <circle cx="8.5" cy="7.5" r=".8" fill="currentColor"></circle>
        <circle cx="6.5" cy="12.5" r=".8" fill="currentColor"></circle>
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.6-.7 1.6-1.6 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16c3.3 0 6-2.7 6-6 0-5.5-4.5-10-10-10z"></path>
      </svg>
    </button>
    <div class="theme-menu" id="themeMenu" role="menu" aria-label="主题颜色" hidden>
      <button type="button" data-theme-name="red" role="menuitemradio" aria-label="红色"></button>
      <button type="button" data-theme-name="orange" role="menuitemradio" aria-label="橙色"></button>
      <button type="button" data-theme-name="yellow" role="menuitemradio" aria-label="黄色"></button>
      <button type="button" data-theme-name="green" role="menuitemradio" aria-label="绿色"></button>
      <button type="button" data-theme-name="blue" role="menuitemradio" aria-label="蓝色"></button>
      <button type="button" data-theme-name="purple" role="menuitemradio" aria-label="紫色"></button>
    </div>

    <main class="me-main">
      <section class="account-card" id="accountCard" aria-labelledby="accountCardTitle">
        <div class="account-card-heading">
          <h2 id="accountCardTitle">账号</h2>
        </div>
        <p class="account-card-title" id="accountCardEmail">未登录</p>
        <a class="account-card-link" id="accountCardLink" href="account.html">管理账号</a>
      </section>

      <section class="report-card" aria-labelledby="bookSummaryTitle">
        <div class="report-heading">
          <h2 id="bookSummaryTitle">ZINE总结</h2>
        </div>
        <button class="report-generate" id="bookSummaryBtn" type="button">生成我的集总结</button>
        <p class="report-status" id="bookSummaryStatus" role="status" aria-live="polite"></p>
        <article class="report-result" id="bookSummaryResult" aria-live="polite" hidden></article>
      </section>

      <section class="report-card" aria-labelledby="reportTitle">
        <div class="report-heading">
          <h2 id="reportTitle">本月日记总结</h2>
        </div>
        <button class="report-generate" id="generateReportBtn" type="button">生成日记报告</button>
        <p class="report-status" id="reportStatus" role="status" aria-live="polite"></p>
        <article class="report-result" id="reportResult" aria-live="polite" hidden></article>
      </section>
    </main>

    <nav class="tabbar">
      <a class="tab" href="index.html">
        <span class="tab-icon">◉</span>
        <span>集</span>
      </a>
      <a class="tab" href="memoir.html">
        <span class="tab-icon">▤</span>
        <span>日历</span>
      </a>
      <a class="tab active" href="me.html">
        <span class="tab-icon">👤</span>
        <span>我</span>
      </a>
    </nav>
  </div>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud-store.js"></script>
  <script src="theme.js"></script>
  <script src="me.js"></script>
</body>
</html>
